[build-system]
requires = ["setuptools>=83.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smartsuite"
version = "1.4.0"
description = "SmartSuite — 工艺数据分析工具箱 (Flask Web UI + CLI + Python API)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "SmartSuite Team"}
]
keywords = ["flask", "web", "cli", "analysis", "manufacturing", "doe", "spc", "anova"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Manufacturing",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "statsmodels>=0.14",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
web = [
    "flask>=3.0",
    "pyarrow>=14.0",
]
report = [
    "python-pptx>=0.6",
    "reportlab>=4.0",
    "openpyxl>=3.0",
]
docs = [
    "mkdocs-material>=9.5",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff==0.16.6",
    "setuptools>=83.0",
    # DOE 设计交叉验证基准库（可选，未安装时 tests/engine/test_doe_pydoe3_parity.py 自动跳过）
    "pyDOE3>=1.0",
    "mypy>=1.11",
    "pytest-benchmark>=4.0",
    "hypothesis>=6.168.0",
]
all = [
    "flask>=3.0",
    "pyarrow>=14.0",
    "python-pptx>=0.6",
    "reportlab>=4.0",
    "openpyxl>=3.0",
]

[project.scripts]
smartsuite = "smartsuite.cli:main"
smartsuite-web = "smartsuite.web.app:cli"

[tool.setuptools.packages.find]
where = ["src"]
include = ["smartsuite*"]

[tool.setuptools.package-data]
"smartsuite" = ["py.typed"]
"smartsuite.web" = ["templates/*", "static/*"]

[tool.mypy]
# numpy 2.5 的存根含 PEP 695 语法（mypy 目标 <3.12 无法解析）；3.10 运行时下限由 ci.yml 矩阵兜底
python_version = "3.12"
# 平台固定 win32：winreg 分支声明于 Windows 专用存根，Linux CI 上按本机平台检查会误报
# attr-defined（本机 Windows mypy 与 CI 同口径）；Linux 运行时走 try/except ImportError 分支
platform = "win32"
files = [
    "src/smartsuite/__init__.py",
    "src/smartsuite/core",
    "src/smartsuite/services",
    "src/smartsuite/engine",
    "src/smartsuite/web",
    "src/smartsuite/cli.py",
]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "benchmark: 性能基准（benchmarks/ 专用，不进入 tests/ 防线）",
]
filterwarnings = [
    "error",
    "ignore:Glyph .* missing from font:UserWarning",
    # tight_layout 在 Linux CI（缺 CJK 字体、标签更宽）无法容纳装饰时退化为默认边距，
    # 图仍可渲染；该警告随字体环境变化，非代码缺陷
    "ignore:Tight layout not applied:UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["E501", "N806"]
# E501 — line length handled by formatter
# N806 — uppercase vars are deliberate (SPC constants A2/D3/D4, stats symbols Q1/Q3/IQR, math notation X/G)
# B007 — 已从全局 ignore 移除，仅在 per-file-ignores 中保留必要文件

[tool.ruff.lint.per-file-ignores]
# 审查 2026-09-19 B8：18 → 16 → 9 条。两类收敛动作：
#   ① 用**等价改写**从源头消除违规（contextlib.suppress 替代 try/except/pass、
#      三元表达式替代 if/else 赋值、`x > 1` 替代 `True if x > 1 else False`）；
#   ② 删除与 `[tool.ruff.lint] ignore` **重复**的冗余条目（E501 / N806 已全局忽略）。
# 每条理由见行尾注释；`tests/guards/test_lint_budget.py` 会校验每条豁免**仍然生效**
# （去掉整段豁免后该规则在该文件里必须仍有违规），防止无用豁免重新堆积。
"src/smartsuite/engine/__init__.py" = ["E402", "I001", "SIM112"]  # matplotlib 全局配置与依赖自检必须先于 import 执行
"src/smartsuite/engine/doe_opt/regression.py" = ["N803"]  # X = 设计矩阵（统计符号约定，非命名笔误）
"src/smartsuite/engine/detection.py" = ["SIM300"]  # ruff 假阳性：Grubbs 统计量 G 全大写被启发式误判为常量
"src/smartsuite/web/*" = ["SIM115"]  # 有意不用 with：NamedTemporaryFile 需在 with 外按文件名使用
"tests/*" = ["F841", "B007", "E402", "I001"]  # 测试夹具惯例：故意保留的未用变量/数学变量/导入顺序
"scripts/verify_consistency.py" = ["E402"]  # 顺序式验证脚本：import 与检查交错执行
"scripts/verify_cross_consistency.py" = ["E402"]  # sys.path 注入后导入 + 顺序式执行
"scripts/verify_frontend_params.py" = ["E402"]  # sys.path 注入后导入 smartsuite（scripts 惯例）
"scripts/verify_manual_claims.py" = ["E402", "N816"]  # sys.path 注入后导入 + 统计符号 F 值命名
