name: Quality Gate

on:
  pull_request:
    paths:
      - "src/smartsuite/**"
      - "scripts/**"
      - "tests/**"
      - "rules/user-manual.md"
      - "rules/api-reference.md"
  workflow_dispatch:

# 最小权限：只读仓库内容；pull-requests: read 供 dependency-review-action 读取 PR 元数据
permissions:
  contents: read
  pull-requests: read

# 版本策略（审查 #P1-8）：quality gate 固定 3.12 加速 PR 反馈，
# 全版本矩阵（3.10–3.13）由 ci.yml full job 覆盖；docs-consistency 用 3.10
# 兜底最低支持版本。
jobs:
  dependency-review:
    name: PR 依赖变更审查
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
      # 对比 PR 前后依赖清单（pyproject.toml），检测已知漏洞/恶意包
      - uses: actions/dependency-review-action@v5

  test-quality-guard:
    name: 测试质量守卫（弱断言/缺测/命名）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run test quality guard
        # WARN 基线 29（审查 #P1-7）：新增弱断言/恒真断言即 FAIL
        run: python scripts/test_quality_guard.py --max-warn 29

  docs-consistency:
    name: 文档一致性（断链/目录树/裸异常/版本漂移）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"  # 最低支持版本兜底（矩阵覆盖见 ci.yml full）
          cache: pip
      - name: Run docs verification
        run: python scripts/verify_docs.py --strict

  manual-parity:
    name: 手册数值一致性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        # 2026-08-21 CI 修复：verify_cross_consistency 读 tests/test_data.xlsx，
        # 需要 openpyxl（report extras）；此前 [dev] 缺依赖 → pd.read_excel ImportError
        run: pip install -e ".[dev,report]"
      - name: Verify manual parity
        run: python scripts/verify_cross_consistency.py

  falsy-audit:
    name: Falsy 模式审计
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Run falsy audit
        run: python scripts/falsy_audit.py

  architecture-check:
    name: 架构约束检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        # Round-2：verify_consistency 内嵌全量 pytest，含 Web 层测试（flask）
        run: pip install -e ".[dev,web,report]"
      - name: Verify architecture
        run: python scripts/verify_consistency.py

  ruff-check:
    name: Ruff Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ruff
        # 审查 2026-09-01 G-8：版本与 pyproject.toml 统一为 0.16.3
        run: pip install ruff==0.16.3
      - name: Ruff format check
        # 审查 2026-09-01 G-8：format 检查范围补 tests/（此前不含，本地与 CI 不一致）
        run: ruff format --check src/smartsuite/ scripts/ tests/