name: Quality Gate

on:
  pull_request:
    paths:
      - "src/smartsuite/**"
      - "scripts/**"
      - "tests/**"
      - "rules/user-manual.md"
      - "rules/api-reference.md"
  workflow_dispatch:

jobs:
  manual-parity:
    name: 手册数值一致性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Verify manual parity
        run: python scripts/verify_cross_consistency.py

  falsy-audit:
    name: Falsy 模式审计
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run falsy audit
        run: python scripts/falsy_audit.py

  architecture-check:
    name: 架构约束检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Verify architecture
        run: python scripts/verify_consistency.py

  ruff-check:
    name: Ruff Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff==0.15.20
      - name: Ruff format check
        run: ruff format --check src/smartsuite/ scripts/
