name: Quality Gate

on:
  pull_request:
    paths:
      - "src/smartsuite/**"
      - "scripts/**"
      - "tests/**"
      - "benchmarks/**"
      - "docs/user-manual/**"
      - "docs/specification/api-reference.md"
      - "uv.lock"
      # 审查 2026-10-09 R2 的 G-10：本 job 的**版本链断言**（tag == pyproject ==
      # manifest == CHANGELOG）与 `verify_docs --strict` 的**目录树登记**，
      # 守护的恰恰是下列文件 —— 而它们原先**不在 paths 里**：改了它们不会触发质量门禁
      # （实测：改 AGENTS.md 的模板数、改 manifest 版本号都不跑本 job）。
      # 这正是 R2 中 `verify_docs --strict` 反复变红的成因 —— 改的人从未看到门禁。
      - "pyproject.toml"
      - "CHANGELOG.md"
      - ".release-please-manifest.json"
      - "AGENTS.md"
      - "templates/**"
      - "mkdocs.yml"
      - "docs/governance/**"
  # main 直推同样要过门禁：PR 事件覆盖不到 release-please 的自动提交与维护者直推，
  # 版本链一旦漂移会**无人拦截**直到发版当天。
  push:
    branches: [main]
  workflow_dispatch:

# 最小权限：只读仓库内容；pull-requests: read 供 dependency-review-action 读取 PR 元数据
permissions:
  contents: read
  pull-requests: read

# 版本策略（审查 #P1-8）：quality gate 固定 3.12 加速 PR 反馈；
# 全版本矩阵（3.10–3.13）由 ci.yml full job（仅 main）覆盖。
# 审查 2026-09-19 D-1：uv.lock 在 3.10 与 3.11+ 解析为两套依赖（pandas 2.x vs 3.0），
# 新增 py310-engine job 在 PR 阶段验证 3.10 分叉路径，避免只在 main 才暴露。
jobs:
  dependency-review:
    name: PR 依赖变更审查
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
      # 对比 PR 前后依赖清单（pyproject.toml），检测已知漏洞/恶意包
      - uses: actions/dependency-review-action@v5

  test-quality-guard:
    name: 测试质量守卫（弱断言/缺测/命名）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
      - name: 安装依赖（冻结锁文件）
        run: uv sync --frozen --all-extras
      - name: Run test quality guard
        # WARN 基线 0（2026-10-09 发版前收尾）。
        # 沿革：全量审查 P1-1 时 CI 口径 89 → 修守卫漏判 + 64 条具名豁免 + 逐条加强 → 11；
        # 打包轮次把上限写成 12（"实测 11 + 1 条余量"）。收尾轮**消减而非调高**：
        #   · 补 2 处守卫自身漏判（`== "字面量"`、`fn(...) is True/False` 两族强断言形态）；
        #   · 11 条 WARN 逐条补真实值断言（Cp=(USL−LSL)/6σ 恒等式、卡方 p 与
        #     `chi2.sf(stat, df)` 独立复算、列联表维度/总数、box_chart 分组元数据、
        #     网格搜索最优点落在区间内、doe 3 水平字符串因子明确拒绝、
        #     inverse_solve 参数三态方向、variance_test 回落与显式口径逐值一致…）；
        #   · 顺带删除 2 条**陈旧豁免**（测试被加强后条目失效，`check_stale_exemptions` 拦下）。
        # 现 WARN 实测 **0**，上限即 0 —— 余量是真实的：任何一条新弱断言直接顶红。
        # **豁免条数始终打印**（现 61 条，见 WEAK_ASSERT_EXEMPT），避免"豁免变看不见"。
        run: uv run python scripts/test_quality_guard.py --max-warn 0

  docs-consistency:
    name: 文档一致性（断链/目录树/裸异常/版本漂移）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.10"  # 最低支持版本兜底（矩阵覆盖见 ci.yml full）
          enable-cache: true
      - name: 安装依赖（冻结锁文件）
        run: uv sync --frozen --all-extras
      - name: Run docs verification
        run: uv run python scripts/verify_docs.py --strict

  manual-parity:
    # 审查 2026-10-09 G-7：job 名原为「手册数值一致性」—— 过度声称：本 job 跑的是
    # verify_cross_consistency.py，其实只校验 MANUAL_EXPECTATIONS 登记的 11 项
    # （/42 任务）；未登记任务的手册漂移由 ci.yml quick 的 verify_manual_claims
    # （38 条 CLAIM）承担。现名字写实，脚本输出亦带"手册覆盖度（G-7）"一行。
    name: 手册数值一致性（抽样：登记 11 项，全量由 ci.yml 手册 CLAIM 门禁承担）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
      - name: 安装依赖（冻结锁文件）
        # --all-extras 含 report（openpyxl）：verify_cross_consistency 读 tests/data/injection_process.xlsx
        # （2026-08-21 CI 修复历史：dev 缺依赖 → pd.read_excel ImportError）
        run: uv sync --frozen --all-extras
      - name: Verify manual parity
        run: uv run python scripts/verify_cross_consistency.py

  falsy-audit:
    name: Falsy 模式审计
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
      - name: 安装依赖（冻结锁文件）
        run: uv sync --frozen --all-extras
      - name: Run falsy audit
        run: uv run python scripts/falsy_audit.py

  py310-engine:
    name: Python 3.10 分叉回归（引擎 + 服务）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.10"
          enable-cache: true
      - name: 安装依赖（冻结锁文件；3.10 解析为 pandas 2.x / numpy 2.2 分叉）
        run: uv sync --frozen --all-extras
      - name: 引擎 + 服务测试（3.10 依赖分叉路径）
        # tests/services 覆盖 Web 序列化/差分（pandas 2.3 downcast 告警族），
        # 2026-09-19 full 矩阵 3.10 曾因该族 5 处失败到达 main —— PR 阶段补齐
        run: uv run pytest tests/engine tests/services -q --tb=short

  architecture-check:
    name: 架构约束检查 + 覆盖率门禁
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
      - name: 安装依赖（冻结锁文件）
        # verify_consistency 内嵌全量 pytest，含 Web 层测试（flask）
        run: uv sync --frozen --all-extras
      - name: Verify architecture (非 pytest 部分)
        run: uv run python scripts/verify_consistency.py --skip-pytest
      - name: 覆盖率门禁（PR 防回退）
        # fail-under=85：2026-09-19 基线 89%；全量 pytest 由本步骤承担（原内嵌于 verify_consistency）
        run: uv run pytest tests/ -q --tb=short --cov=smartsuite --cov-report=term-missing:skip-covered --cov-fail-under=85

  ruff-check:
    name: Ruff Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
      - name: 安装依赖（冻结锁文件）
        # 审查 2026-09-11 R-8：ruff 版本以 pyproject.toml dev extra 为准（0.16.8），
        # 现由 uv.lock 锁定，消除"quality.yml 手工钉版本"的漂移面
        run: uv sync --frozen --all-extras
      - name: Ruff format check
        # 审查 2026-09-01 G-8：format 检查范围补 tests/（此前不含，本地与 CI 不一致）
        run: uv run ruff format --check src/smartsuite/ scripts/ tests/ benchmarks/

  type-check:
    name: Mypy Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.11"
          enable-cache: true
      - name: 安装依赖（冻结锁文件）
        run: uv sync --frozen --all-extras
      - name: Type check (src/smartsuite)
        run: uv run mypy
