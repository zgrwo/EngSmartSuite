name: CI

on:
  push:
    branches: [main]
    # 路径过滤：无关文件改动不启动 runner，节省资源（workflow_dispatch 不受限）
    paths:
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "templates/**"
      - "docs/**"
      - "skills/**"
      - ".github/**"
      - "AGENTS.md"
      - "README.md"
      - "CONTRIBUTING.md"
      - "CHANGELOG.md"
      - "SECURITY.md"
      - "CODE_OF_CONDUCT.md"
      - "pyproject.toml"
      - "uv.lock"
      - "benchmarks/**"
      - ".pre-commit-config.yaml"
      - ".release-please-manifest.json"
      # 根级启动/安装脚本（第二轮 #9）：改动这些也必须触发 CI
      - "run_server.py"
      - "run_smartsuite.bat"
      - "run_smartsuite.sh"
      - "setup_offline.bat"
      - "setup_offline.sh"
  pull_request:
    branches: [main]
    # 路径过滤：无关文件改动不启动 runner，节省资源（workflow_dispatch 不受限）
    paths:
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "templates/**"
      - "docs/**"
      - "skills/**"
      - ".github/**"
      - "AGENTS.md"
      - "README.md"
      - "CONTRIBUTING.md"
      - "CHANGELOG.md"
      - "SECURITY.md"
      - "CODE_OF_CONDUCT.md"
      - "pyproject.toml"
      - "uv.lock"
      - "benchmarks/**"
      - ".pre-commit-config.yaml"
      - ".release-please-manifest.json"
      # 根级启动/安装脚本（第二轮 #9）：改动这些也必须触发 CI
      - "run_server.py"
      - "run_smartsuite.bat"
      - "run_smartsuite.sh"
      - "setup_offline.bat"
      - "setup_offline.sh"
  workflow_dispatch:

# 自动取消同一 PR 的旧运行，节省 runner 资源
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 最小权限：本工作流只读仓库内容（Security hardening 最佳实践）
permissions:
  contents: read

jobs:
  # ── 快速检查：lint + 导入 + 核心测试（每次 push 触发）──
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # 提交规范检查需要 PR 基线与完整提交历史
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.11"
          enable-cache: true

      - name: 安装 Python 解释器（离线锁检查前置）
        # 2026-09-22 PR #44 实测：setup-uv@v10 仅设置 UV_PYTHON，不再落地解释器；
        # `uv lock --offline` 因「offline 模式下无法下载 3.11」直接失败（5s 红）。
        # 显式安装后，离线锁检查在缓存解释器上零网络运行。
        run: uv python install "$UV_PYTHON"

      - name: 锁文件新鲜度（防 release/合并漏重新锁定）
        # 背景：release-please 只 bump pyproject/CHANGELOG/manifest，不动 uv.lock；
        # 而 `uv sync --frozen` 在锁过期时仍退出 0（根包版本不参与依赖图求解），
        # 故本仓已三次手工补齐（148052a 1.3.1 / 8e30d99 ruff 0.16.6 / eeef512 1.4.0）。
        # --offline：无漂移时零网络开销（实测 1ms），避免索引拖慢或抖动。
        # 文案说明（审查 2026-09-21 G-3）：若**缓存未命中且同时存在漂移**，本步会以
        # "Packages were unavailable because the network was disabled …" 报错而非
        # "lockfile needs to be updated"——退出码仍为 1（门禁有效），但文案指向缓存。
        # 多数情况不会命中该分支：漂移来自 release-please 改 pyproject（uv.lock 未变），
        # setup-uv 缓存键依赖 uv.lock → 缓存命中、文案正确。
        run: uv lock --offline --check

      - name: 安装依赖（冻结锁文件）
        # --all-extras 含 dev/report/web/docs（统一安装模板，避免逐 job 漂移）
        run: uv sync --frozen --all-extras

      # --- 提交规范：PR 内全部 commit 必须符合 Conventional Commits（与 release-please 闭环）---
      - name: 提交规范检查（Conventional Commits）
        if: github.event_name == 'pull_request'
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          count=0
          for sha in $(git rev-list --no-merges "$base..HEAD"); do
            count=$((count + 1))
            if ! git show -s --format=%B "$sha" | bash scripts/validate-commit-msg.sh >/dev/null 2>&1; then
              echo "❌ 提交 ${sha:0:7} 不符合 Conventional Commits 规范："
              git show -s --format='   %s' "$sha"
              echo "   规则见 scripts/validate-commit-msg.sh 与 CONTRIBUTING「提交规范」"
              exit 1
            fi
          done
          echo "✅ 全部 $count 个提交符合规范"

      - name: 模块导入验证
        # 审查 2026-09-21 G-8：原先只 print 计数、无断言——导入失败当然会红，
        # 但「导出数/任务数与预期不符」这类漂移会静默通过（真断言此前只在
        # consistency job）。现就地加上与 verify_consistency 同源的两条关系断言：
        #   ① 任务数 > 0（注册表可加载且非空）；
        #   ② engine 导出 ⊇ 任务实现函数的名称集（注册链不断裂）。
        run: |
          uv run python - <<'PY'
          import sys
          from smartsuite.engine import __all__ as eng
          from smartsuite.services.orchestrator import TASK_REGISTRY

          n_eng, n_task = len(eng), len(TASK_REGISTRY)
          print(f"{n_eng} engine exports, {n_task} tasks registered")
          problems = []
          if n_task == 0:
              problems.append("TASK_REGISTRY 为空")
          missing = {f.__name__ for f in TASK_REGISTRY.values()} - set(eng)
          if missing:
              problems.append(f"engine 未导出已注册任务实现: {sorted(missing)}")
          if problems:
              print("[FAIL] " + "; ".join(problems), file=sys.stderr)
              sys.exit(1)
          PY

      - name: Ruff Lint
        run: uv run ruff check src/smartsuite/ scripts/ tests/ benchmarks/

      - name: Ruff Format
        run: uv run ruff format --check src/smartsuite/ scripts/ tests/ benchmarks/

      - name: 引擎层核心测试
        # 第二轮 #8：--basetemp 固定独立临时目录（Windows junction 防护，见 verify_consistency.py #5.2）
        run: uv run pytest tests/engine/ -x -q --tb=short --basetemp=${{ runner.temp }}/pytest-engine

      - name: 服务层测试
        run: uv run pytest tests/services/ -x -q --tb=short --basetemp=${{ runner.temp }}/pytest-services

      - name: 回归防线测试（guards：微尺度/规格限/跨层）
        run: uv run pytest tests/guards/ -q --tb=short --basetemp=${{ runner.temp }}/pytest-guards

      - name: 治理脚本测试
        run: uv run pytest tests/scripts/ -q --tb=short --basetemp=${{ runner.temp }}/pytest-scripts

      - name: 集成测试
        run: uv run pytest tests/integration/test_integration.py tests/integration/test_task_registry_smoke.py -x -q --tb=short --basetemp=${{ runner.temp }}/pytest-integration

      # 审查 2026-08-19 #5.3：全量一致性门禁此前只在 main push 的 full job 跑，
      # 引擎崩溃（如 scatter_plot 重复列）可在 PR 阶段静默合入；纳入 PR 门禁
      # 第二轮 #8：--skip-pytest 跳过脚本内嵌套的全量 pytest（上方已逐层跑过），
      # 只保留 42 任务 status=ok 冒烟判定，避免重复跑完整套件
      - name: 全量一致性校验（42 任务 status=ok 冒烟门禁）
        run: uv run python scripts/verify_consistency.py --skip-pytest

      # 审查 2026-09-01 G-1 后续：verify_manual_claims 此前只修了
      # "永远 exit 0"，但无任何 job 调用——门禁仍 inert（verify_all.py:17 的
      # "由 CI full job 覆盖"声明与实际 grep 不符）。纳入 quick job：
      # PR 即拦手册数值漂移（原计划 full job 仅 main push 才跑，且为矩阵
      # 多版本环境，数值易跨版本抖动）；本 job 固定 ubuntu-3.11 + 全 extras。
      - name: 手册数值声明 ↔ 引擎输出交叉校验
        run: uv run python scripts/verify_manual_claims.py

  # ── Web E2E（审查 2026-08-19 #3.6：test_web_e2e 需运行中服务器，
  #     CI 此前从不启动服务器 → 40 个 Web 路径测试永远跳过）──
  e2e:
    needs: quick
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.11"
          enable-cache: true

      - name: 安装依赖（冻结锁文件）
        run: uv sync --frozen --all-extras

      - name: Linux CJK 字体
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk

      - name: 启动服务器并运行 Web E2E（全部方法）
        run: |
          uv run python run_server.py > /tmp/smartsuite-server.log 2>&1 &
          SERVER_PID=$!
          READY=0
          for i in $(seq 1 30); do
            if curl -s http://127.0.0.1:5050/api/tasks > /dev/null 2>&1; then
              echo "服务器就绪（第 ${i} 次探测）"
              READY=1
              break
            fi
            sleep 1
          done
          # 第二轮 #7：服务器起不来时不再"全绿跳过"——30 次探测失败即红
          if [ "$READY" != "1" ]; then
            echo "❌ 服务器 30 次探测未就绪"
            if kill -0 $SERVER_PID 2>/dev/null; then
              echo "服务器进程仍存活但未响应——服务日志尾部："
              tail -40 /tmp/smartsuite-server.log
            else
              echo "服务器进程已退出——启动失败，完整日志："
              cat /tmp/smartsuite-server.log
            fi
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi
          # 审查 2026-09-19 G-1：默认 shell 为 `bash -e`，裸 `RC=$?` 不可达；
          # 用 if/else 捕获退出码，确保服务器进程总被清理且退出码正确传播
          if uv run python -m pytest tests/integration/test_web_e2e.py -q --tb=short; then
            RC=0
          else
            RC=$?
          fi
          kill $SERVER_PID 2>/dev/null || true
          exit $RC

  # ── 全矩阵测试（仅 main 分支 push 或手动触发，节省 resources）──
  full:
    needs: quick
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        exclude:
          # 3.12/3.13 仅排除 macOS（runner 成本高、无平台特有分支）；
          # Windows 为主部署平台，3.12/3.13 补回验证（2026-09-19 决定）
          - os: macos-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: 安装依赖（冻结锁文件）
        run: uv sync --frozen --all-extras

      - name: Linux CJK 字体 (matplotlib 图表中文渲染)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk

      - name: 全量测试
        # 第二轮 #8：--basetemp 固定独立临时目录（Windows junction 防护）
        run: uv run pytest tests/ -q --tb=short --basetemp=${{ runner.temp }}/pytest-full

      - name: 一致性校验
        # 第二轮 #8：full job 保留完整嵌套 pytest（矩阵上再跑一次全量）
        run: uv run python scripts/verify_consistency.py

  # ── 代码质量分析（仅 main push 或手动触发）──
  quality:
    needs: quick
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.11"
          enable-cache: true

      - name: 安装依赖（冻结锁文件）
        run: uv sync --frozen --all-extras

      - name: 测试覆盖率
        # fail-under=85：2026-09-19 实测 89.67%（本 job 单平台基线；full 矩阵不带 cov，无跨平台比较）
        run: uv run pytest tests/ -q --tb=short --cov=smartsuite --cov-report=term-missing:skip-covered --cov-report=html --cov-fail-under=85

      - name: 死代码检测 (vulture)
        # Pydantic classmethod validator 的 cls 参数为误报，过滤之
        # vulture 不在 extras 中，用 uv run --with 临时叠加（不写入锁文件）
        # 仅采信 vulture 输出格式行（path:line:），隔离 uv 安装噪声
        # （2026-09-19 CI 实测：uv 进度输出混入 filtered → 假死代码）
        run: |
          output=$(uv run --with vulture vulture src/smartsuite/ --min-confidence=90 --exclude="*/tests/*,*/__pycache__/*" 2>&1) || true
          filtered=$(printf '%s\n' "$output" | grep -E '^[^ :]+:[0-9]+:' | grep -v "unused variable 'cls'" || true)
          if [ -n "$filtered" ]; then
            echo "$filtered"
            exit 1
          fi
          echo "Vulture: 无死代码（已过滤 Pydantic cls 误报）"

      - name: 依赖安全审计
        run: uv run --with pip-audit pip-audit

      - name: 上传覆盖率报告
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 7

  # ── 注册链一致性检查（不限分支）──
  consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.11"
          enable-cache: true

      - name: 安装依赖（冻结锁文件）
        run: uv sync --frozen --all-extras

      - name: TASK_REGISTRY ↔ DEFAULT_PARAMS ↔ TASK_LABELS 一致性
        run: |
          uv run python << 'EOF'
          from smartsuite.services.orchestrator import TASK_REGISTRY, DEFAULT_PARAMS, TASK_LABELS, TASK_GROUPS
          reg = set(TASK_REGISTRY.keys())
          params = set(DEFAULT_PARAMS.keys())
          labels = set(TASK_LABELS.keys())
          groups = set().union(*[set(v) for v in TASK_GROUPS.values()])
          assert reg == params, f"REGISTRY({len(reg)}) != PARAMS({len(params)}): {reg ^ params}"
          assert reg == labels, f"REGISTRY({len(reg)}) != LABELS({len(labels)}): {reg ^ labels}"
          assert reg == groups, f"REGISTRY({len(reg)}) != GROUPS({len(groups)}): {reg ^ groups}"
          print(f"OK: {len(reg)} tasks — TASK_REGISTRY = DEFAULT_PARAMS = TASK_LABELS = TASK_GROUPS")
          EOF

      - name: TASK_REGISTRY 引擎函数全部导出
        run: |
          uv run python << 'EOF'
          from smartsuite.engine import __all__ as engine_exports
          from smartsuite.services.orchestrator import TASK_REGISTRY
          reg_funcs = {fn.__name__ for fn in TASK_REGISTRY.values()}
          missing_from_engine = reg_funcs - set(engine_exports)
          assert not missing_from_engine, f"{len(missing_from_engine)} funcs not exported from engine: {missing_from_engine}"
          print(f"OK: All {len(reg_funcs)} registry funcs exported from engine/__init__.py")
          EOF

      - name: 前后端参数键集一致性（静态解析 app.js TASK_PARAMS vs DEFAULT_PARAMS）
        # 审查 2026-09-06 E4/G4：此前"前后端参数默认值一致性"步骤实跑 verify_cross_consistency
        # （运行时交叉验证，不含 app.js 解析），前端键漂移无任何自动化拦截。
        run: uv run python scripts/verify_frontend_params.py

      - name: 全量交叉验证（Web ↔ CLI ↔ 手册 CLAIM）
        run: set -o pipefail && uv run python scripts/verify_cross_consistency.py 2>&1 | tail -5