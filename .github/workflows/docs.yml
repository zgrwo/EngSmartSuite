name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# 最小权限：workflow 级只读仓库内容。`pages: write` + `id-token: write` 属
# **部署专用**能力，原先写在顶层 ⇒ PR 的 `build` job 同样持有它们（最小权限违约）：
# `mkdocs build` 会执行 PR 分支里可被修改的 `mkdocs.yml` 与文档插件代码，
# 而同仓分支 PR 的 GITHUB_TOKEN 不被强制降级（fork PR 才降）⇒ 构建过程可持有
# 可部署 Pages / 可签 OIDC 的令牌。审查 2026-10-09 G-11：下移到 `deploy` job；
# 对照 release.yml 的 `build-artifacts` job 级权限收敛（同仓既有范式）。
permissions:
  contents: read

# 审查 2026-09-19 G-1：Pages 部署不取消进行中的部署（GitHub 官方 starter 惯例）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.11"
          enable-cache: true
      - name: 安装文档依赖（冻结锁文件）
        run: uv sync --frozen --extra docs
      - name: 构建（严格模式）
        run: uv run mkdocs build --strict
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    # 审查 2026-09-19 G-1：PR 仅做构建校验，部署仍限 main push / 手动触发
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # 审查 2026-10-09 G-11：部署能力只授予真正执行部署的 job
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
