# ============================================================================
# release.yml — release-please 自动发版 + tag 构建构件
# 触发：main 分支推送（release-please 推导版本）+ release published（构建产物）
# 机制：从 Conventional Commits 自动推导版本号、生成 CHANGELOG.md、
#       打开 release PR → 合并后自动打 tag + 建 GitHub Release；
#       tag 触发时构建 wheel/sdist 并 attach 到 GitHub Release（2026-09-05 补齐）
# 前置：
#   1. 仓库 Settings → Actions → Workflow permissions 允许写权限
#   2. commit 必须符合 Conventional Commits（见 ci.yml「提交规范检查」，
#      scripts/validate-commit-msg.sh）——commit 规范 → 版本推导的闭环前提
# 手动覆盖：在 release PR 的 commit body 加 `Release-As: x.y.z` 强制指定版本
# ============================================================================
name: Release

on:
  push:
    branches: [main]
  # 2026-09-05：tag 由 release-please 经 API 创建，push 事件不触发；
  # 必须监听 release published 事件（API 创建 Release 同样触发）
  release:
    types: [published]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    # tag 推送也触发本 workflow，release-please 只在 main 分支运行
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # manifest 模式下不得在 with 中设置 release-type（会覆盖 config.json）
      - uses: googleapis/release-please-action@v5
        with:
          config-file: .github/release-please/config.json
          manifest-file: .release-please-manifest.json

  # 2026-09-05 新增：历史上 release 从未产出 wheel/sdist（历次 GitHub Release
  # assets 均为空），本 job 补齐"产物发布"承诺。构建源码 = tag 指向的提交
  # （release-please 合并 PR 后打 tag，内容即 main 最新）。
  build-artifacts:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: 构建 wheel 与 sdist
        run: |
          pip install build
          python -m build

      - name: 上传构件到 GitHub Release
        run: gh release upload "${GITHUB_REF#refs/tags/}" dist/* --clobber
        env:
          GH_TOKEN: ${{ github.token }}