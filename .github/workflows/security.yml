# ============================================================================
# security.yml — CodeQL 安全扫描 + 依赖漏洞审计
# 触发：main 推送 / PR / 每周一凌晨 2 点定时
# 前置：仓库 Settings → Code security → CodeQL 默认设置关闭（避免重复），
#       或保持默认设置启用并删除本文件（二选一）
# ============================================================================
name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 本仓为纯 Python 项目（前端 app.js 静态文件不参与构建），仅保留 python
        language: [python]
    steps:
      - uses: actions/checkout@v7
      - name: 依赖漏洞扫描（pip-audit）
        # 检查项目已解析依赖是否含已知 CVE（补 CodeQL 静态分析盲区；来源：VibeCodingTemplate）。
        # 关键：先安装项目依赖再 audit（否则审计的是 runner 环境而非项目依赖 = no-op）。
        # ⚠️ 不能审计整个环境：runner 预装系统包会报几十个与本项目无关的 CVE 假阳性。
        # 必须定向审计项目声明依赖（pyproject 提取）。
        # 安装失败 → 显式失败（exit 1），不用 `|| true` 吞掉——否则"已扫描"是假象。
        if: matrix.language == 'python'
        run: |
          python -m pip install pip-audit
          python -m pip install -e ".[dev]" || { echo "::error::项目依赖安装失败，无法审计"; exit 1; }
          if [ -f requirements.txt ]; then
            python -m pip_audit -r requirements.txt || { echo "::error::pip-audit 发现已知 CVE 依赖，请升级"; exit 1; }
          elif [ -f pyproject.toml ]; then
            # 提取项目声明的 dependencies + dev extra 定向审计（不含 runner 预装系统包）；
            # 单行 python -c（避免 YAML block scalar 内多行缩进破坏解析）
            python -c "import tomllib;d=tomllib.load(open('pyproject.toml','rb'));p=d.get('project',{});print('\n'.join(list(p.get('dependencies') or [])+list(p.get('optional-dependencies',{}).get('dev') or [])))" > pip-audit-deps.txt
            python -m pip_audit -r pip-audit-deps.txt || { echo "::error::pip-audit 发现已知 CVE 依赖，请升级"; exit 1; }
            rm -f pip-audit-deps.txt
          else
            echo "::error::未找到 pyproject.toml 或 requirements.txt，pip-audit 无法审计项目依赖"
            exit 1
          fi
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@v4
      - uses: github/codeql-action/analyze@v4
