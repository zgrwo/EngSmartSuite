# ============================================================================
# security.yml — CodeQL 安全扫描 + 依赖漏洞审计
# 触发：main 推送 / PR / 每周一凌晨 2 点定时
# 前置：仓库 Settings → Code security → CodeQL 默认设置关闭（避免重复），
#       或保持默认设置启用并删除本文件（二选一）
# ============================================================================
name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 本仓为纯 Python 项目（前端 app.js 静态文件不参与构建），仅保留 python
        language: [python]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - name: 依赖漏洞扫描（pip-audit）
        # 检查项目已解析依赖是否含已知 CVE（补 CodeQL 静态分析盲区；来源：VibeCodingTemplate）。
        # 关键：先安装项目依赖再 audit（否则审计的是 runner 环境而非项目依赖 = no-op）。
        # ⚠️ 不能审计整个环境：runner 预装系统包会报几十个与本项目无关的 CVE 假阳性。
        # 必须定向审计项目依赖。
        # 安装失败 → 显式失败（exit 1），不用 `|| true` 吞掉——否则"已扫描"是假象。
        #
        # 审查 2026-10-09 P2-15：**改为审计 `uv.lock` 的锁定版本**。
        # 原实现审计 pyproject 的**声明区间**（`pandas>=2.0` 这类），pip-audit 会把它
        # 解析成"当前最新版"——与 uv.lock 里实际安装的版本可能不同，
        # 于是"锁定版有 CVE、最新版已修"这类**真实漏报**不会被发现（反之也会误报），
        # 门禁结论与实际发布物脱钩。现在优先用锁定集；拿不到锁定集就**失败**，
        # 而不是悄悄退回未锁定口径。
        if: matrix.language == 'python'
        run: |
          # 审查 2026-10-09 G-16：① 扫描器**锁版本**（原 `pip install pip-audit`
          # 不固定版本 ⇒ 新 pip-audit 改判定/误报行为会让本 job 无故变红）；
          # ② 删掉原先的 `pip install -e ".[dev]"` —— 它是"先装项目依赖再审计"
          # 时代的遗留，P2-15 改为审计 `uv export --frozen` 的锁定集后已成冗余
          # （审计读的是 `-r locked-reqs.txt`，不读当前环境）。
          python -m pip install "pip-audit==2.10.1"
          if [ -f uv.lock ]; then
            # --no-emit-project：排除本项目自身（它不在 PyPI 上，pip-audit 无法查询）
            uv export --frozen --no-emit-project --format requirements-txt > locked-reqs.txt \
              || { echo "::error::uv export 失败，无法得到锁定依赖集（拒绝在未锁定口径下审计）"; exit 1; }
            if [ ! -s locked-reqs.txt ]; then
              echo "::error::锁定依赖集为空，pip-audit 审计将退化为 no-op"
              exit 1
            fi
            echo "锁定依赖条目数: $(grep -c . locked-reqs.txt)"
            python -m pip_audit -r locked-reqs.txt || { echo "::error::pip-audit 在 uv.lock 锁定版本中发现已知 CVE，请升级"; exit 1; }
            rm -f locked-reqs.txt
          elif [ -f requirements.txt ]; then
            echo "::warning::未找到 uv.lock，退回审计 requirements.txt（口径可能与实际安装不同）"
            python -m pip_audit -r requirements.txt || { echo "::error::pip-audit 发现已知 CVE 依赖，请升级"; exit 1; }
          else
            echo "::error::未找到 uv.lock 或 requirements.txt，pip-audit 无法审计项目依赖"
            exit 1
          fi
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@v4
      - uses: github/codeql-action/analyze@v4
