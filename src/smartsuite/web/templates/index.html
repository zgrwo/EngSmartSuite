<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartSuite — 工艺数据分析工具箱</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header>
  <span class="logo">SmartSuite</span>
  <span class="subtitle">工艺数据分析工具箱</span>
  <div class="header-right">
    <input type="file" id="file-input" accept=".xlsx,.xlsm,.csv" hidden>
    <button id="btn-upload" data-action="pick-file">📂 打开数据文件</button>
    <select id="encoding" title="CSV 文件编码（.xlsx / .xlsm 不受影响）">
      <option value="">自动识别</option>
      <option value="utf-8-sig">UTF-8</option>
      <option value="gbk">GBK</option>
      <option value="gb18030">GB18030</option>
      <option value="big5">Big5（繁体）</option>
      <option value="utf-16">UTF-16</option>
    </select>
    <span id="filename" class="filename">未选择文件</span>
    <span id="shape" class="shape"></span>
  </div>
</header>

<div class="main">
  <aside id="left-panel">
    <div class="panel-header">列定义</div>
    <div class="toolbar">
      <button data-action="auto-detect" class="btn-sm">智能识别</button>
      <button data-action="select-all-y" class="btn-sm">全选Y</button>
      <button data-action="select-all-x" class="btn-sm">全选X</button>
      <button data-action="clear-columns" class="btn-sm">清空</button>
    </div>
    <div id="col-list" class="col-list">
      <div class="empty-hint">请先加载数据文件</div>
    </div>
    <div id="col-status" class="col-status">Y=0 X=0 类别=0</div>
    <!-- 参数面板（按需显示） -->
    <div id="param-panel" class="param-panel is-hidden">
      <div class="panel-header">分析参数</div>
      <div class="param-body" id="param-body"></div>
    </div>
  </aside>

  <main id="center-panel">
    <div class="workflow">
      {% for group, tasks in task_groups.items() %}
      <div class="wf-group" data-group="{{ group }}">
        <div class="wf-title">{{ group }}</div>
        <div class="wf-buttons">
          {% for t in tasks %}
          <button data-action="run-task" data-task="{{ t }}" class="btn-analysis">{{ task_labels[t] }}</button>
          {% endfor %}
        </div>
      </div>
      {% endfor %}
    </div>
    <div id="results" class="results">
      <div class="empty-hint">选择分析方法开始</div>
    </div>
    <!-- 报告导出（P5）：分析成功后才显示；格式由 EXPORT_FORMATS 定义 -->
    <div id="export-bar" class="export-bar is-hidden">
      <span class="export-label">导出报告</span>
      <button data-action="export-report" data-format="html" class="btn-sm">网页 (HTML)</button>
      <button data-action="export-report" data-format="pdf" class="btn-sm">PDF</button>
      <button data-action="export-report" data-format="ppt" class="btn-sm">PowerPoint</button>
      <button data-action="export-report" data-format="xlsx" class="btn-sm">Excel 工作簿</button>
    </div>
  </main>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<!-- ⚠️ 缓存版本化的**范围**（审查 2026-10-09 P3-5，本轮只记录、不改行为）：
     下面只有**入口**带 `?v=12`；而 ESM 子模块之间的 import（`app.js` → `./util.js`、
     `./api.js`、`./params.js`、`./state.js`）用的是**无版本 URL**，浏览器按 URL
     独立缓存 —— 于是下一轮只改 `params.js` 时，老用户可能继续跑旧面板
     （`Ctrl+Shift+R` 才能刷掉；本轮无实害，因为这 5 个模块全部是新增/重写）。
     正确修法：服务端注入构建标识（`url_for('static', filename='app.js', v=BUILD_ID)`
     并把同一标识传播到子模块的 import URL），涉及 `web/app.py`（不在本批文件所有权内），
     故本轮只在此登记风险。详见 logs/reports/2026-10-09-release-prep-full-review.md 的 P3-5。 -->
<script type="module" src="/static/app.js?v=12"></script>
</body>
</html>
